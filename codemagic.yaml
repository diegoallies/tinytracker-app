# Codemagic CI for TinyTrack.
#
# Deliberately reuses the existing fastlane lanes rather than Codemagic's
# `flutter build ipa` recipe. The Fastfile archives via gym specifically because
# Flutter's own export step can fail on the embedded TinyTrackWatch app — that
# problem doesn't go away just because the build moved to CI.
#
# ── One-time setup in the Codemagic UI ───────────────────────────────────────
# Add these as SECURE environment variables in a group called `appstore`
# (Application settings → Environment variables → mark "Secure"):
#
#   ASC_KEY_ID          the 10-char App Store Connect API key id
#   ASC_ISSUER_ID       the issuer uuid from App Store Connect → Integrations
#   ASC_KEY_P8_BASE64   base64 of ios/fastlane/AuthKey.p8, produced with:
#                         base64 -i ios/fastlane/AuthKey.p8 | pbcopy
#
# The .p8 itself is gitignored on purpose — it is never committed, only injected
# here at build time and written to disk inside the ephemeral CI machine.
#
# Firebase config (google-services.json, GoogleService-Info.plist,
# firebase_options.dart) and .env ARE committed, so no extra wiring needed.

definitions:
  base: &base
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.44.6
      xcode: latest
      cocoapods: default

workflows:
  ios-testflight:
    <<: *base
    name: iOS → TestFlight
    # Native code signing: Codemagic uses the Apple Developer Portal
    # integration (named `tinytrack` in team settings) to fetch the
    # distribution certificate + App Store profiles for BOTH bundle ids
    # before any script runs. `xcode-project use-profiles` then applies them
    # and writes /Users/builder/export_options.plist, which gym picks up.
    # This replaces cloud signing (-authenticationKey* xcargs), which
    # repeatedly failed on fresh CI machines.
    integrations:
      app_store_connect: tinytrack
    environment:
      flutter: 3.44.6
      xcode: latest
      cocoapods: default
      groups:
        - appstore
      ios_signing:
        # Explicit references, NOT distribution_type + bundle_identifier.
        # The automatic form matches against profiles stored in Codemagic, not
        # against Apple's portal — so creating profiles at Apple did nothing for
        # it and it kept failing with "No matching profiles found". These names
        # are the Reference names given when fetching the profiles into
        # Settings → Code signing identities.
        provisioning_profiles:
          - tinytrack-appstore
          - tinytrack-watch-appstore
        certificates:
          - tinytrack-dist
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Restore the App Store Connect API key
        script: |
          # fastlane still needs this for the UPLOAD (pilot/deliver + Spaceship
          # release notes) — signing no longer uses it.
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > ios/fastlane/AuthKey.p8
          test -s ios/fastlane/AuthKey.p8 || { echo "AuthKey.p8 is empty — check ASC_KEY_P8_BASE64"; exit 1; }
      - name: Apply fetched signing profiles
        script: xcode-project use-profiles
      - name: Pick a build number Apple will accept
        script: |
          # Apple rejects duplicate build numbers, and releases can come from a
          # laptop as well as CI — so derive the number from what's actually
          # uploaded rather than trusting pubspec. Read by flutter_compile in
          # the Fastfile via --build-number.
          LATEST=$(app-store-connect get-latest-app-store-build-number 6786685436 2>/dev/null \
                   || app-store-connect get-latest-testflight-build-number 6786685436 2>/dev/null \
                   || echo 0)
          LATEST=${LATEST:-0}
          NEXT=$((LATEST + 1))
          echo "Latest uploaded: $LATEST -> using $NEXT"
          echo "CI_BUILD_NUMBER=$NEXT" >> "$CM_ENV"
      - name: flutter pub get
        script: flutter pub get
      - name: flutter analyze
        script: flutter analyze lib/
      - name: flutter test
        script: flutter test
      - name: Upload to TestFlight via fastlane
        script: |
          cd ios
          # Full output to an artifact so a failure is a one-click download,
          # not an archaeology dig through the web console.
          set -o pipefail
          fastlane beta 2>&1 | tee /tmp/fastlane.log
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - /tmp/fastlane.log
      - build/ios/**/*.dSYM.zip
    publishing:
      email:
        recipients:
          - diegoallies27@gmail.com
        notify:
          success: true
          failure: true

  ios-appstore:
    <<: *base
    name: iOS → App Store (production)
    integrations:
      app_store_connect: tinytrack
    environment:
      flutter: 3.44.6
      xcode: latest
      cocoapods: default
      groups:
        - appstore
      ios_signing:
        # Explicit references, NOT distribution_type + bundle_identifier.
        # The automatic form matches against profiles stored in Codemagic, not
        # against Apple's portal — so creating profiles at Apple did nothing for
        # it and it kept failing with "No matching profiles found". These names
        # are the Reference names given when fetching the profiles into
        # Settings → Code signing identities.
        provisioning_profiles:
          - tinytrack-appstore
          - tinytrack-watch-appstore
        certificates:
          - tinytrack-dist
    # Deliberately NOT triggered by pushes to main. The `release` lane submits
    # for review AND auto-publishes on approval, so an accidental merge would
    # ship to real users. Releasing is an explicit act: tag the commit.
    #
    #   git tag v1.1.4 && git push origin v1.1.4
    #
    # That also leaves a permanent record in git of exactly what shipped.
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Restore the App Store Connect API key
        script: |
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > ios/fastlane/AuthKey.p8
          test -s ios/fastlane/AuthKey.p8 || { echo "AuthKey.p8 is empty — check ASC_KEY_P8_BASE64"; exit 1; }
      - name: Apply fetched signing profiles
        script: xcode-project use-profiles
      - name: Pick a build number Apple will accept
        script: |
          # Apple rejects duplicate build numbers, and releases can come from a
          # laptop as well as CI — so derive the number from what's actually
          # uploaded rather than trusting pubspec. Read by flutter_compile in
          # the Fastfile via --build-number.
          LATEST=$(app-store-connect get-latest-app-store-build-number 6786685436 2>/dev/null \
                   || app-store-connect get-latest-testflight-build-number 6786685436 2>/dev/null \
                   || echo 0)
          LATEST=${LATEST:-0}
          NEXT=$((LATEST + 1))
          echo "Latest uploaded: $LATEST -> using $NEXT"
          echo "CI_BUILD_NUMBER=$NEXT" >> "$CM_ENV"
      - name: flutter pub get
        script: flutter pub get
      - name: flutter analyze
        script: flutter analyze lib/
      - name: flutter test
        script: flutter test
      - name: Submit to the App Store via fastlane
        script: |
          cd ios
          set -o pipefail
          fastlane release 2>&1 | tee /tmp/fastlane.log
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - /tmp/fastlane.log
      - build/ios/**/*.dSYM.zip
    publishing:
      email:
        recipients:
          - diegoallies27@gmail.com
        notify:
          success: true
          failure: true

  android-aab:
    name: Android → AAB artifact
    # Linux, not macOS: Android needs no Xcode, and macOS M2 minutes are the
    # scarce resource on the free plan.
    instance_type: linux_x2
    max_build_duration: 45
    environment:
      flutter: 3.44.6
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: flutter pub get
        script: flutter pub get
      - name: flutter analyze
        script: flutter analyze lib/
      - name: flutter test
        script: flutter test
      - name: Build release AAB
        # Unsigned-for-Play: there is no upload keystore or Play service account
        # configured yet, so this produces an artifact to download rather than
        # publishing. Wire `android_signing` + a Play key when you're ready.
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - diegoallies27@gmail.com
        notify:
          success: true
          failure: true
