name: tinytrack_app
description: "AI-powered baby tracking app"
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Supabase
  supabase_flutter: ^2.8.3

  # UI & Animation
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2

  # Charts
  fl_chart: ^0.70.2

  # Local storage
  shared_preferences: ^2.5.3
  hive_flutter: ^1.1.0

  # Media
  image_picker: ^1.1.2
  photo_view: ^0.15.0

  # PDF
  pdf: ^3.11.2
  printing: ^5.14.2

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

  # Utils
  intl: ^0.19.0
  timeago: ^3.7.0
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  share_plus: ^13.1.0
  connectivity_plus: ^6.1.4
  flutter_dotenv: ^5.2.1
  http: ^1.3.0
  app_links: ^6.3.2
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "tinytrack_logo.jpg"
  adaptive_icon_background: "#7C3AED"
  adaptive_icon_foreground: "tinytrack_logo.jpg"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/images/
